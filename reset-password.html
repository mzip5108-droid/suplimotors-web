<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña - Supli Motors</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="overlay-cargando" style="background: linear-gradient(135deg, #1a56db 0%, #3b82f6 50%, #1e40af 100%);">
        <div class="overlay-cargando-contenido">
            <div class="overlay-cargando-logo">
                <span class="logo-texto" style="font-size: 2rem; color: white !important; -webkit-text-fill-color: white !important;">Supli <span style="color: rgba(255,255,255,0.9); -webkit-text-fill-color: rgba(255,255,255,0.9);">Motor's</span></span>
            </div>
            
            <div id="estado-cargando">
                <div class="overlay-cargando-spinner"></div>
                <h3 class="overlay-cargando-titulo">Verificando link...</h3>
                <p class="overlay-cargando-subtitulo">Un momento por favor</p>
            </div>
            
            <div id="form-reset" style="display: none; max-width: 400px; margin: 0 auto; background: white; padding: 32px; border-radius: 20px; text-align: left;">
                <h2 style="color: #0f172a; font-size: 1.4rem; margin-bottom: 8px;">Nueva contraseña</h2>
                <p style="color: #64748b; font-size: 0.875rem; margin-bottom: 24px;">
                    Ingresá tu nueva contraseña. Debe tener al menos 6 caracteres.
                </p>
                
                <div class="campo-facturacion" style="margin-bottom: 16px;">
                    <label style="color: #64748b; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;">Nueva contraseña</label>
                    <input type="password" id="nueva-password" placeholder="Mínimo 6 caracteres" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.875rem;">
                </div>
                
                <div class="campo-facturacion" style="margin-bottom: 20px;">
                    <label style="color: #64748b; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;">Confirmar contraseña</label>
                    <input type="password" id="confirmar-password" placeholder="Repetí la contraseña" style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.875rem;">
                </div>
                
                <div id="reset-error" style="display: none; color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 8px; font-size: 0.8rem; text-align: center; margin-bottom: 16px;"></div>
                <div id="reset-exito" style="display: none; color: #16a34a; background: #dcfce7; padding: 10px; border-radius: 8px; font-size: 0.8rem; text-align: center; margin-bottom: 16px;"></div>
                
                <button id="btn-cambiar-password" style="width: 100%; padding: 14px; background: linear-gradient(135deg, #1a56db 0%, #1e40af 100%); color: white; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer;">
                    Cambiar contraseña
                </button>
            </div>
            
            <div id="estado-error" style="display: none; max-width: 400px; margin: 0 auto; background: white; padding: 32px; border-radius: 20px; text-align: center;">
                <h2 style="color: #dc2626; font-size: 1.4rem; margin-bottom: 8px;">Link inválido</h2>
                <p style="color: #64748b; font-size: 0.875rem; margin-bottom: 24px;">
                    El link de recuperación expiró o ya fue usado. Solicitá uno nuevo.
                </p>
                <a href="index.html" style="display: inline-block; padding: 12px 24px; background: #1a56db; color: white; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 0.875rem;">
                    Volver al login
                </a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://hzjnbuvgrlvovjhzoaab.supabase.co";
        const SUPABASE_KEY = "sb_publishable_1AOO_cAl75uqc9ISPgn06A__2z1DFs-";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', async () => {
            // Supabase maneja el token del link automáticamente
            // Esperamos a que procese la sesión del link
            await new Promise(resolve => setTimeout(resolve, 800));
            
            const { data: { session }, error } = await sb.auth.getSession();
            
            if (error || !session) {
                // Link inválido o expirado
                document.getElementById('estado-cargando').style.display = 'none';
                document.getElementById('estado-error').style.display = 'block';
                return;
            }
            
            // Mostrar formulario
            document.getElementById('estado-cargando').style.display = 'none';
            document.getElementById('form-reset').style.display = 'block';
        });

        document.getElementById('btn-cambiar-password').addEventListener('click', async () => {
            const nueva = document.getElementById('nueva-password').value;
            const confirmar = document.getElementById('confirmar-password').value;
            const errDiv = document.getElementById('reset-error');
            const okDiv = document.getElementById('reset-exito');
            const btn = document.getElementById('btn-cambiar-password');
            
            errDiv.style.display = 'none';
            okDiv.style.display = 'none';
            
            if (!nueva || !confirmar) {
                errDiv.textContent = 'Completá ambos campos';
                errDiv.style.display = 'block';
                return;
            }
            
            if (nueva.length < 6) {
                errDiv.textContent = 'La contraseña debe tener al menos 6 caracteres';
                errDiv.style.display = 'block';
                return;
            }
            
            if (nueva !== confirmar) {
                errDiv.textContent = 'Las contraseñas no coinciden';
                errDiv.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Cambiando...';
            
            try {
                const { error } = await sb.auth.updateUser({ password: nueva });
                
                if (error) {
                    errDiv.textContent = 'Error: ' + error.message;
                    errDiv.style.display = 'block';
                    return;
                }
                
                okDiv.textContent = '¡Contraseña cambiada! Redirigiendo al login...';
                okDiv.style.display = 'block';
                
                // Cerrar sesión y volver al login
                setTimeout(async () => {
                    await sb.auth.signOut();
                    window.location.href = 'index.html';
                }, 2000);
                
            } catch (err) {
                errDiv.textContent = 'Error inesperado: ' + err.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Cambiar contraseña';
            }
        });
    </script>
</body>
</html>
